<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">INZINDEV — Software, AI and Robotics</title>
  <desc id="desc">A minimal dark developer banner with a violet animated grid, terminal window and subtle motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a10"/><stop offset=".58" stop-color="#10111d"/><stop offset="1" stop-color="#171027"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#c4b5fd" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#c4b5fd" opacity=".22"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity=".45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="32s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="1000" cy="170" rx="260" ry="210" fill="url(#halo)" filter="url(#blur)">
      <animate attributeName="opacity" values=".55;.9;.55" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0 278H1200" stroke="#a78bfa" stroke-opacity=".12"/>
    <path d="M0 279H1200" stroke="url(#beam)" stroke-width="2">
      <animate attributeName="opacity" values=".15;.7;.15" dur="7s" repeatCount="indefinite"/>
    </path>

    <g opacity=".55" fill="none" stroke="#8b5cf6" stroke-width="1.4">
      <path d="M700 62h50l22 22h52"/><path d="M720 268h66l18-18h38"/><path d="M1070 70h42l18 18h70"/>
      <circle cx="700" cy="62" r="3" fill="#c4b5fd"/><circle cx="1112" cy="70" r="3" fill="#c4b5fd"/>
      <circle cx="720" cy="268" r="3" fill="#c4b5fd"/>
    </g>
    <circle cx="1040" cy="60" r="4" fill="#c4b5fd">
      <animate attributeName="opacity" values=".25;1;.25" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="286" r="3" fill="#a78bfa">
      <animate attributeName="opacity" values="1;.2;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="76" y="84" fill="#b9a6ff" font-size="15" font-weight="700" letter-spacing="4">INDEPENDENT DEVELOPER / BRAZIL</text>
      <text x="70" y="166" fill="#f4f2fb" font-size="76" font-weight="750" letter-spacing="-3">INZINDEV</text>
      <rect x="76" y="190" width="64" height="3" rx="1.5" fill="url(#violet)"/>
      <text x="76" y="228" fill="#dedbea" font-size="22" font-weight="500">Software  ·  AI  ·  Robotics</text>
      <text x="76" y="260" fill="#89869a" font-size="15" letter-spacing=".5">Building ideas into working projects.</text>
    </g>

    <g transform="translate(760 74)">
      <rect x="0" y="0" width="368" height="194" rx="13" fill="#0b0d15" stroke="#8f79c8" stroke-opacity=".52"/>
      <path d="M0 38H368" stroke="#51436e" stroke-opacity=".5"/>
      <circle cx="20" cy="19" r="4" fill="#f87171"/><circle cx="36" cy="19" r="4" fill="#fbbf24"/><circle cx="52" cy="19" r="4" fill="#4ade80"/>
      <text x="76" y="23" fill="#747187" font-family="monospace" font-size="10">inzindev / workspace</text>
      <g font-family="SFMono-Regular,Consolas,monospace" font-size="14">
        <text x="25" y="72" fill="#a78bfa">const</text><text x="75" y="72" fill="#f3f0ff"> developer = {</text>
        <text x="43" y="101" fill="#93c5fd">focus:</text><text x="104" y="101" fill="#d8b4fe"> "building",</text>
        <text x="43" y="130" fill="#93c5fd">interests:</text><text x="130" y="130" fill="#d8b4fe"> ["AI", "web", "robotics"]</text>
        <text x="25" y="159" fill="#f3f0ff">};</text>
        <rect x="49" y="147" width="8" height="15" rx="1" fill="#c4b5fd">
          <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
        </rect>
      </g>
      <path d="M25 176H343" stroke="#262337"/>
      <circle cx="30" cy="185" r="3" fill="#4ade80">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="41" y="189" fill="#777488" font-family="monospace" font-size="9">SYSTEM READY</text>
    </g>
    <rect x="-240" y="0" width="160" height="340" fill="url(#beam)" opacity=".55" transform="skewX(-18)">
      <animate attributeName="x" from="-260" to="1320" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="76" y="316" fill="#666276" font-family="monospace" font-size="11" letter-spacing="2">LEARN / BUILD / ITERATE</text>
    <text x="1120" y="316" fill="#666276" font-family="monospace" font-size="11" text-anchor="end">v.01</text>
  </g>
</svg>